server:
  port: 9091
  address: 0.0.0.0
  tomcat:
    threads:
      max: 250
      min-spare: 50

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/my_database?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  redis:
    host: localhost
    port: 6379

  mvc:
    throw-exception-if-no-handler-found: true

  web:
    resources:
      add-mappings: false
logging:
  level:
    root: INFO
    org.backend: DEBUG
    org.springframework.security: DEBUG

jwt:
  secret: asdfghjklqwertyuiopzxcvbnm1234567890

app:
  cors:
    allowed-origins:
      - "*"
twilio:
  account:
    sid: ${TWILIO_SID}
  auth:
    token: ${TWILIO_AUTH_TOKEN}
  sms:
    from: ${TWILIO_SMS_FROM}
  whatsapp:
    sandbox: ${TWILIO_WHATSAPP_SANDBOX}

address:
  max:
    count: ${ADDRESS_MAX_COUNT:5}